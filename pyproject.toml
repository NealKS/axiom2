[project]
name = "axiom-access-risk"
version = "0.1.0"
description = "Explainable access-risk intelligence for SaaS permissions and smart-contract operations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Madan Kumar G S" }]
keywords = ["access-risk", "identity-security", "saas-security", "smart-contracts", "aws", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
vyper = ["vyper-guard>=0.7.0"]
dev = ["pytest>=7.4.0", "ruff>=0.1.0", "build>=1.0.0"]

[project.scripts]
axiom = "axiom.cli:app"

[project.urls]
Homepage = "https://github.com/madankumargs/Axiom"
Repository = "https://github.com/madankumargs/Axiom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
